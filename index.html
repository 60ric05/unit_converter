<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="main">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input id="input-el" type="text" placeholder="-">
            <button id="convert-btn">Convert</button>
        </div>
        <div id="convertions">
            <div class="convertions-header">
                <h2>Length[meter/feet]</h2>
                <p id="length-el">1 meters = 3.28084 feet | 1 feet = 0.3048 meters</p>
            </div>
            <div class="convertions-header">
                <h2>Volume[liters/gallons]</h2>
                <p id="volume-el">1 liters = 0.264172 gallons | 1 gallons = 3.78541 liters</p>
            </div>
            <div class="convertions-header">
                <h2>Mass[kilograms/pounds]</h2>
                <p id="mass-el">1 kilograms = 2.20462 pounds | 1 pounds = 0.453592 kilograms</p>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
